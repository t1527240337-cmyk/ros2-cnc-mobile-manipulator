amcl:
  ros__parameters:
    use_sim_time: true
    # Gazebo always spawns the robot at this known map pose. Let AMCL consume
    # it during lifecycle configuration instead of repeatedly publishing
    # /initialpose while the simulated clock is still starting.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: -1.2
      z: 0.0
      yaw: 0.0
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan_filtered
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # Base odometry is validated against independent Gazebo truth. Keep the
    # particle cloud close to that reliable motion prior; otherwise repeated
    # CNC geometry lets the likelihood field jump to a symmetric aisle.
    alpha1: 0.005
    alpha2: 0.005
    alpha3: 0.005
    alpha4: 0.005
    alpha5: 0.005
    laser_model_type: likelihood_field
    laser_max_beams: 120
    laser_likelihood_max_dist: 2.0
    min_particles: 500
    max_particles: 2000
    resample_interval: 1
    update_min_d: 0.05
    update_min_a: 0.05

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker, bin_staging_goal_checker]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.10
      required_movement_angle: 0.10
      movement_time_allowance: 45.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Keep CNC/charger staging inside the visual side-step domain. An
      # 80 mm translation plus 60 mrad heading residual remains a coarse Nav2
      # stop, but cannot demand an unsafe half-metre lateral correction.
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.06
      stateful: true
    bin_staging_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Nav2 owns the 80 mm cross-track capture domain; the AprilTag servo
      # then corrects reach and heading without a non-holonomic side step.
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.12
      stateful: true
    controller_plugins: [FollowPath]
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Use the physical base's validated envelope for cross-factory transit.
      # Docking retains its own lower speed profile.
      desired_linear_vel: 0.55
      lookahead_dist: 0.65
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.90
      use_velocity_scaled_lookahead_dist: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # CNCs and bins inflate most of each aisle. Cost-based speed scaling
      # therefore held the robot near its minimum for an entire cross-factory
      # route even though the planned path and controller collision check were
      # clear. Keep curvature regulation, but reserve proximity slowing for
      # the dedicated docking controller at the end of the route.
      use_cost_regulated_linear_velocity_scaling: false
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.30
      # Do not spend the last several metres in the final-goal ramp. Docking
      # owns the precise approach after Nav2 reaches this coarse staging pose.
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.45
      use_rotate_to_heading: true
      # AMCL and the software-rendered scan can trail fast in-place turns.
      # A bounded turn rate prevents heading overshoot from becoming a full
      # recovery spin while retaining a useful industrial-base cycle time.
      rotate_to_heading_angular_vel: 0.60
      max_angular_accel: 1.5

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    drive_on_heading: {plugin: nav2_behaviors::DriveOnHeading}
    wait: {plugin: nav2_behaviors::Wait}
    global_frame: odom
    robot_base_frame: base_link

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Include the gripper and workpiece in the validated loaded-carry pose.
      footprint: "[[0.62, 0.34], [0.62, -0.34], [-0.48, -0.34], [-0.48, 0.34]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan_filtered, data_type: LaserScan, clearing: true, marking: true, max_obstacle_height: 2.0}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.55, cost_scaling_factor: 3.0}

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.62, 0.34], [0.62, -0.34], [-0.48, -0.34], [-0.48, 0.34]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: nav2_costmap_2d::StaticLayer, map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan_filtered, data_type: LaserScan, clearing: true, marking: true, max_obstacle_height: 2.0}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.55, cost_scaling_factor: 3.0}

map_server:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 10.0
    feedback: OPEN_LOOP
    max_velocity: [0.55, 0.0, 0.60]
    min_velocity: [-0.30, 0.0, -0.60]
    # VelocityControl already enforces the bounded command directly.  High
    # smoothing acceleration avoids wall-time stalls when software-rendered
    # simulation runs below real time.
    # These limits are achievable by the 95 kg base and give the passive
    # casters time to align before combined translation and rotation.
    max_accel: [1.2, 0.0, 1.5]
    max_decel: [-1.5, 0.0, -1.8]
    odom_topic: /odometry/filtered

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Keep a small emergency-stop zone active while the larger predictive
    # footprint is calibrated. Nav2 requires at least one valid polygon.
    polygons: [StopZone]
    StopZone:
      type: circle
      radius: 0.18
      action_type: stop
      min_points: 1
      visualize: true
      polygon_pub_topic: collision_stop_zone
      enabled: false
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan_filtered
      min_height: 0.05
      max_height: 2.0
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    max_retries: 3
    base_frame: base_footprint
    fixed_frame: odom
    odom_topic: /odometry/filtered
    dock_prestaging_tolerance: 0.5
    dock_plugins: [factory_station, factory_bin_station, charging_station]
    factory_station:
      plugin: factory_docking::StrictNonChargingDock
      docking_threshold: 0.015
      angular_threshold: 0.0524
      # Fuse the mapped CNC tag pose with vision. AprilTag may refine a
      # calibrated station locally, but one noisy frame cannot move the whole
      # manipulation coordinate system across a vise jaw.
      use_nominal_pose_guard: true
      max_refinement_translation: 0.005
      max_refinement_yaw: 0.0087
      staging_x_offset: -0.7
      use_external_detection_pose: true
      # WSL software rendering publishes camera frames slowly. Keep the last
      # verified tag pose long enough to finish the short docking approach.
      external_detection_timeout: 12.0
      # Keep 70 mm between the chassis bumper and the CNC door plane.
      external_detection_translation_x: -0.48
      external_detection_rotation_roll: -1.5708
      external_detection_rotation_pitch: 1.5708
      external_detection_rotation_yaw: 0.0
    # Bin markers are mounted 0.55 m sideways so their physical posts
    # stay outside all three arm work corridors. This plugin maps that
    # lateral tag pose back to the center-line manipulation fixture.
    factory_bin_station:
      plugin: factory_docking::StrictNonChargingDock
      # Coarse stop only; dock_station performs the final 20 mm tag translation servo.
      docking_threshold: 0.10
      angular_threshold: 0.20
      # Keep Nav2 outside the raw-bin inflation boundary and leave a useful
      # visual-control approach distance to converge both XY and heading.
      staging_x_offset: -1.0
      # The database pose is the center-line staging reference; map it
      # to the calibrated arm work pose before bounded visual refinement.
      use_nominal_pose_guard: true
      # Keep this identical to docking.yaml: the 50 mm closer work stance
      # brings every randomized-bin target away from the arm reach boundary.
      nominal_target_translation_x: -0.532
      nominal_target_translation_y: 0.0
      max_refinement_translation: 0.015
      max_refinement_yaw: 0.0175
      use_external_detection_pose: true
      external_detection_timeout: 12.0
      external_detection_translation_x: -0.57
      external_detection_translation_y: 0.55
      external_detection_rotation_roll: -1.5708
      external_detection_rotation_pitch: 1.5708
      external_detection_rotation_yaw: 0.0
    charging_station:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.03
      staging_x_offset: -0.7
      use_external_detection_pose: true
      external_detection_timeout: 12.0
      external_detection_translation_x: -0.54
      external_detection_rotation_roll: -1.5708
      external_detection_rotation_pitch: 1.5708
      external_detection_rotation_yaw: 0.0
      use_battery_status: true
      charging_threshold: 0.5
      battery_state_topic: /battery_state
    docks: [raw_bin, finished_bin, machine_1, machine_2, machine_3, charge_dock]
    raw_bin: {type: factory_bin_station, frame: map, pose: [-3.85, -2.7, 3.14159]}
    finished_bin: {type: factory_bin_station, frame: map, pose: [3.85, -2.7, 0.0]}
    machine_1: {type: factory_station, frame: map, pose: [3.8, 1.98, 1.5708]}
    machine_2: {type: factory_station, frame: map, pose: [0.8, 1.98, 1.5708]}
    machine_3: {type: factory_station, frame: map, pose: [-2.2, 1.98, 1.5708]}
    charge_dock: {type: charging_station, frame: map, pose: [0.0, -3.087, -1.5708]}
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.12
      v_linear_max: 0.30
      v_angular_max: 0.75
      slowdown_radius: 0.20
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.75
