name: Logic CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install ROS 2 Jazzy tooling
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Install declared workspace dependencies
        shell: bash
        run: |
          rosdep update
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro jazzy \
            -r \
            -y
      - name: Build and run repository checks
        shell: bash
        run: bash scripts/run_checks.sh
