services:
  factory:
    build:
      context: .
      dockerfile: Dockerfile
    image: embodied-factory:jazzy
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility,video
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./artifacts:/workspace/artifacts
      - factory_ros_logs:/root/.ros
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  factory_ros_logs:
